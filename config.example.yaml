gateway:
  port: 6820
  host: "127.0.0.1"
  verbose: false

channels:
  telegram:
    enabled: false
    bot_token: ""
  discord:
    enabled: false
    bot_token: ""
  whatsapp:
    enabled: false
    db_path: ""
  slack:
    enabled: false
    bot_token: ""             # xoxb-... (Bot User OAuth Token)
    app_token: ""             # xapp-... (App-Level Token with connections:write)
  webchat:
    enabled: true

agent:
  provider: "openai"       # openai | anthropic
  model: "gpt-4o"
  openai:
    api_key: ""
    model: "gpt-4o"
    # base_url: "https://api.openai.com"       # optional host / proxy
    # chat_path: "/v1/chat/completions"        # optional; change when API path versions
  # anthropic:
  #   api_key: ""
  #   model: "claude-sonnet-4-20250514"
  #   base_url: "https://api.anthropic.com"
  #   messages_path: "/v1/messages"            # optional; change when API path versions

memory:
  enabled: true
  db_path: "~/.meowclaw/memory.db"
