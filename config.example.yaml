gateway:
  port: 6820
  host: "127.0.0.1"              # keep loopback unless behind a reverse proxy + TLS
  verbose: false
  # api_token: ""                # if set: Bearer required for /api/send, /api/channels; ?token= for WebSocket
  # trusted_origins: []         # WebSocket Origin allowlist; empty = http://<host>:port + localhost
  # allow_any_websocket_origin: false  # true = disable Origin check (not recommended)
  # max_api_body_bytes: 1048576  # default 1 MiB

channels:
  telegram:
    enabled: false
    bot_token: ""
  discord:
    enabled: false
    bot_token: ""
  whatsapp:
    enabled: false
    db_path: ""
  slack:
    enabled: false
    bot_token: ""             # xoxb-... (Bot User OAuth Token)
    app_token: ""             # xapp-... (App-Level Token with connections:write)
  webchat:
    enabled: true
  line:
    enabled: false
    channel_secret: ""        # LINE Developers Console → Basic settings
    access_token: ""          # LINE Developers Console → Messaging API → Channel access token
  kakao:
    enabled: false            # Kakao i Open Builder skill → https://YOUR_DOMAIN/webhook/kakao

agent:
  provider: "openai"       # openai | anthropic | gemini
  model: "gpt-4o"
  # max_input_runes: 100000   # cap one user message; omit for default (100000)
  openai:
    api_key: ""
    model: "gpt-4o"
    # base_url: "https://api.openai.com"       # optional host / proxy
    # chat_path: "/v1/chat/completions"        # optional; change when API path versions
  # anthropic:
  #   api_key: ""
  #   model: "claude-sonnet-4-20250514"
  #   base_url: "https://api.anthropic.com"
  #   messages_path: "/v1/messages"            # optional; change when API path versions
  # gemini:
  #   api_key: ""
  #   model: "gemini-2.5-flash"
  #   base_url: "https://generativelanguage.googleapis.com"
  #   generate_path: "/v1beta/models/%s:generateContent"   # %s = model name

memory:
  enabled: true
  db_path: "~/.meowclaw/memory.db"
